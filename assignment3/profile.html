<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <main class="page">
        <section class="profile-card">
            <div class="cover">
                <button class="add-button">+</button>
            </div>

            <img
                class="avatar"
                src="https://media.licdn.com/dms/image/v2/D5603AQF5xir4nnyB6w/profile-displayphoto-crop_800_800/B56Zs_jsnGJUAM-/0/1766297882333?e=1782345600&v=beta&t=aPbPEXazw0LG_z13FlLqNDJ7mnOXRr3YFRkGoUn4DYM"
                alt="Varshit jha"
            >

            <h1>Varshit jha</h1>
            <p class="bio">Product Designer who focuses on simplicity &amp; usability.</p>

            <div class="stats">
                <div>
                    <strong>72.9K</strong>
                    <span>Likes</span>
                </div>
                <div>
                    <strong>828</strong>
                    <span>Posts</span>
                </div>
                <div>
                    <strong>342.9K</strong>
                    <span>Views</span>
                </div>
            </div>

            <div class="socials">
                <span class="instagram-icon" aria-label="Instagram"></span>
                <span class="x-icon">X</span>
                <span class="threads-icon" aria-label="Threads"></span>
            </div>
        </section>
    </main>
</body>
</html>
