<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid basics</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main-container{
            background-color: rgb(242, 168, 168);
            margin: 10px;
            border-radius: 10px;
        }
        .container{
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 4px solid rgb(42, 41, 41);

            display: grid;

            grid-template-columns: repeat(6, 100px);
            grid-template-rows: repeat(6, 100px);

            grid-gap: 5px;
            grid-auto-rows: 100px;
        }
        
        .item{
            color: white;
            border: 4px solid rgb(255, 1, 35);
            border-radius: 10px;
            background-color: rgb(252, 65, 93);

            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px; 
        }

        .item-1{
            grid-row: 1/3;
            grid-column: 1/5;
            background-color: rgb(73, 73, 241);
            border: 4px solid blue;
        }

        .item-2{
            grid-area: 2/4/4/6;
            z-index: 1;
            background-color: rgb(80, 155, 97);
            border: 4px solid rgb(2, 183, 32);
        }

        .item-3{
            grid-area: 3/1/7/7;
            z-index: 0;
            background-color: rgb(230, 211, 162);
            border: 4px solid rgb(167, 132, 204);
        }


    </style>
</head>
<body>
    <div class="main-container">
        <div class="container">
            <div class="item item-1">1</div>
            <div class="item item-2">2</div>
            <div class="item item-3">3</div>
            <div class="item item-4">4</div>
            <div class="item item-5">5</div>
            <div class="item item-6">6</div>
        </div>
    </div>

</body>
</html>
