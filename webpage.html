<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Clone</title>
  <link rel="stylesheet" href="webpage.css">
</head>
<body>
  <header class="navbar">
    <div class="logo"></div>

    <div class="nav-search">
      <select aria-label="Search category">
        <option>All</option>
      </select> 
      <input type="text" placeholder="Search Amazon">
      <button type="button" aria-label="Search">&#128269;</button>
    </div>

    <div class="nav-links">
      <div>
        <span>Hello, Sign in</span>
        <p>Account & Lists</p>
      </div>

      <div>
        <span>Returns</span>
        <p>& Orders</p>
      </div>

      <div>
        <span>Your</span>
        <p>Cart &#128722;</p>
      </div>
    </div>
  </header>

  <main>
    <!-- <section class="hero">
      <div class="hero-msg">
        You are on Amazon Clone made using HTML and CSS only.
      </div>
    </section> -->

    <section class="products">
      <div class="box">
        <h2>Clothes</h2>
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" alt="Clothes">
        <a href="#">Shop now</a>
      </div>

      <div class="box">
        <h2>Electronics</h2>
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Electronics">
        <a href="#">See more</a>
      </div>

      <div class="box">
        <h2>Furniture</h2>
        <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85" alt="Furniture">
        <a href="#">Explore</a>
      </div>

      <div class="box">
        <h2>Beauty Picks</h2>
        <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9" alt="Beauty products">
        <a href="#">Discover</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-top">Back to Top</div>
    <div class="footer-bottom">&copy; 2026 Amazon Clone | HTML & CSS Project</div>
  </footer>
</body>
</html>
